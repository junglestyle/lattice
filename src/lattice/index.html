// --- Review ------------------------------------------------------------------------------------------------

const REASONS = ["no context", "not my interests", "garbled", "already have it", "too obvious"];
let cardId;   // the capture (or "batch:n") on screen; a sync redraws it only when it changes

// Lower touch: Idea Machine's server picks a few spot checks across its confidence (state.review.audit), which I
// judge one by one; the rest I can keep in one go, flagged as kept in bulk so Idea Machine can weigh them less.
// Any I untick stay in the queue for me. My default is to keep: the value comes as the lattice grows.
let oneByOne = false;   // this visit, I chose to go through them all
const mine = new Set((() => { try { return JSON.parse(store.get("judge-myself")) || []; } catch { return []; } })());
// The spot checks I was shown, remembered once I keep the rest: picking again from what's left would draw on the
// ones I chose to judge myself, and their verdicts aren't the unbiased sample ({"audit": true}) Idea Machine trusts.
const shownChecks = () => { try { return JSON.parse(store.get("spot-checks")) || []; } catch { return []; } };
const live = () => new Set(state.review.items.map(i => i.id));
const spot = () => {
  const kept = shownChecks().filter(id => live().has(id));
  return new Set(kept.length ? kept : state.review.audit || []);
};
const rest = () => state.review.items.filter(i => !spot().has(i.id));
const bulkable = () => rest().filter(i => !mine.has(i.id));
const showBatch = () => !oneByOne && !comparing && bulkable().length > 0;

// Spot checks first, lowest confidence first; then the rest, most confident first.
function queue() {
  const conf = new Map(state.review.items.map(i => [i.id, i.confidence]));
  const at = new Map([...spot()].sort((a, b) => conf.get(a) - conf.get(b)).map((id, n) => [id, n]));
  return [...state.review.items].sort((a, b) => (at.get(a.id) ?? Infinity) - (at.get(b.id) ?? Infinity));
}

function renderReview() {
  const {items, total} = state.review;
  document.getElementById("badge").textContent = total ? `· ${total}` : "";
  const key = showBatch() ? `batch:${rest().length}` : queue()[0]?.id
    ?? (revisiting ? `look:${secondLook()[0]?.ev.item_id}` : undefined);
  if (key !== cardId || (!items.length && !comparing)) renderCard();
}

function renderBatch() {
  const box = document.getElementById("review");
  const items = rest(), checks = state.review.items.length - items.length;
  cardId = `batch:${items.length}`;
  const kinds = d3.rollups(items, v => v.length, i => i.kind).sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `${n} ${esc(k)}${n > 1 ? "s" : ""}`).join(", ");
  box.innerHTML = `<article class="card batch">
      <div class="meta"><span>${state.review.total} waiting</span></div>
      <h2>Check ${checks || "none"}, keep the rest</h2>
      <p class="gist">${checks ? `${checks} picked at random across Idea Machine's confidence, lowest to highest, for you
        to judge one by one. ` : ""}The other ${items.length} can be kept in one go: ${kinds}.</p>
      <details><summary>See the ${items.length}</summary>
        <p class="muted">Untick any you'd rather judge yourself.</p>
        <ul class="rest">${items.map(i => `<li><label><input type="checkbox" data-id="${esc(i.id)}"
          ${mine.has(i.id) ? "" : "checked"}><span><span class="tag">${esc(i.kind)}</span> ${esc(i.gist)}</span></label></li>`).join("")}</ul>
      </details>
    </article>
    <div class="actions"><div class="row two"><button id="b-one">One by one</button><button id="b-keep"></button></div></div>`;
  const keepBtn = box.querySelector("#b-keep");
  const label = () => { const n = bulkable().length; keepBtn.textContent = `Keep ${n}`; keepBtn.disabled = !n; };
  label();
  box.querySelectorAll(".rest input").forEach(c => c.addEventListener("change", () => {
    c.checked ? mine.delete(c.dataset.id) : mine.add(c.dataset.id);
    store.set("judge-myself", JSON.stringify([...mine].filter(id => live().has(id))));
    label();
  }));
  box.querySelector("#b-one").addEventListener("click", () => { oneByOne = true; renderCard(); });
  keepBtn.addEventListener("click", async () => {
    const keep = bulkable();
    store.set("spot-checks", JSON.stringify([...spot()]));
    await actAll(keep.map(i => ({kind: "item_keep", item_id: i.id, bulk: true})));
    toast(`Kept ${keep.length}`);
    renderCard();
  });
}

// --- Which is better? ---------------------------------------------------------------------------------------
// Once the captures run out, I can compare ideas two at a time: a steadier signal for Idea Machine's ranking than
// keep and discard. Idea Machine picks the pairs (pub.compare_pairs) when it publishes them; otherwise two ideas
// with neighbouring scores, else two sharing a theme. A pair is never asked twice, and the order shown is random.

let comparing = false;
const skipped = new Set();

function nextPair() {
  const key = (a, b) => [a, b].sort().join(" ");
  const done = new Set((state.compared || []).map(([a, b]) => key(a, b)));
  const fresh = (a, b) => a !== b && state.ideas[a] && state.ideas[b] && !done.has(key(a, b)) && !skipped.has(key(a, b));
  const pick = xs => xs[Math.floor(Math.random() * xs.length)];
  let pair = null, reason = null;
  const suggested = (state.pairs || []).find(p => fresh(p.first, p.second));
  if (suggested) [pair, reason] = [[suggested.first, suggested.second], suggested.reason];
  if (!pair) {
    const ranked = state.graph.nodes.filter(n => n.score != null).sort((a, b) => a.score - b.score);
    const close = ranked.slice(1).map((n, i) => [n.score - ranked[i].score, ranked[i].id, n.id])
      .filter(([, a, b]) => fresh(a, b)).sort((x, y) => x[0] - y[0]).slice(0, 10);
    if (close.length) { const [, a, b] = pick(close); [pair, reason] = [[a, b], "close_scores"]; }
  }
  if (!pair) {
    const options = [];
    for (const t of state.graph.themes) {
      const members = state.graph.nodes.filter(n => n.themes.includes(t.name)).map(n => n.id);
      members.forEach((a, i) => members.slice(i + 1).forEach(b => { if (fresh(a, b)) options.push([a, b]); }));
    }
    if (options.length) [pair, reason] = [pick(options), "same_theme"];
  }
  if (!pair) return null;
  if (Math.random() < 0.5) pair.reverse();
  return {first: pair[0], second: pair[1], reason};
}

const REASON = {never_compared: "not compared before", mixed_criteria: "mixed signals", close_scores: "close scores",
                same_theme: "same theme"};

function renderCompare() {
  const box = document.getElementById("review");
  const pair = nextPair();
  if (!pair) { comparing = false; renderCard(); return; }
  const card = (id, w) => `<button class="pick" data-w="${w}"><b>${esc(state.ideas[id].title)}</b>` +
                          `<span>${esc(state.ideas[id].statement)}</span></button>`;
  box.innerHTML = `<article class="card">
      <div class="meta"><span>Which is the better idea?</span>${pair.reason ? `<span>${esc(REASON[pair.reason] || pair.reason)}</span>` : ""}</div>
      <p class="gist">Better meaning: more worth keeping, building on or telling someone.</p>
      ${card(pair.first, "first")}${card(pair.second, "second")}
    </article>
    <div class="actions"><div class="row">
      <button id="cmp-stop">Stop</button><button id="cmp-skip">Can't say</button><button id="cmp-tie">About the same</button>
    </div></div>`;
  const answer = async winner => {
    await act({kind: "idea_compare", idea_id: pair.first, other_idea_id: pair.second, winner});
    renderCompare();
  };
  box.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => answer(b.dataset.w)));
  box.querySelector("#cmp-tie").addEventListener("click", () => answer("tie"));
  box.querySelector("#cmp-skip").addEventListener("click", () => {
    skipped.add([pair.first, pair.second].sort().join(" ")); renderCompare();
  });
  box.querySelector("#cmp-stop").addEventListener("click", () => { comparing = false; renderCard(); });
}

function renderCard() {
  const box = document.getElementById("review");
  document.getElementById("badge").textContent = state.review.total ? `· ${state.review.total}` : "";
  if (showBatch()) { renderBatch(); return; }
  const item = queue()[0];
  cardId = item?.id;
  const checks = queue().filter(i => spot().has(i.id)).map(i => i.id), check = checks.indexOf(item?.id);
  const isCheck = check >= 0 && (shownChecks().some(id => live().has(id)) || snap.review.total > snap.review.audit?.length);
  if (!item && comparing) { renderCompare(); return; }
  if (!item && revisiting) { renderRevisit(); return; }
  if (!item) {
    const look = secondLook().length;
    box.innerHTML = `<div class="done"><p>${state.review.total ? "That's all this device holds; more on the next sync."
                                          : "Nothing waiting. New captures arrive with each hourly run."}</p>
      ${look ? `<p><button id="look-start">Look again at ${look} kept unread</button></p>
        <p class="muted">Kept with the rest without reading, and they've since turned out to matter.</p>` : ""}
      ${nextPair() ? `<p><button id="cmp-start">Compare ideas two at a time</button></p>
        <p class="muted">Which of two is better? It tunes how Idea Machine ranks your ideas.</p>` : ""}</div>`;
    box.querySelector("#cmp-start")?.addEventListener("click", () => { comparing = true; renderCompare(); });
    box.querySelector("#look-start")?.addEventListener("click", () => { revisiting = true; renderRevisit(); });
    return;
  }
  box.innerHTML = `<article class="card">
      <div class="meta">${isCheck ? `<span>spot check, ${checks.length} left</span>` : ""}
        <span>${esc(item.kind)}</span><span>${esc(item.said_by)}</span>
        <span>${when(item.said_at)}</span><span>confidence ${Math.round(item.confidence * 100)}%</span></div>
      <p class="quote">“${esc(item.quote)}”</p>
      <p class="gist">${esc(item.gist)}</p>
      ${item.idea ? `<p class="idea">In the lattice as: <b>${esc(item.idea.title)}</b>
        <button class="linkbtn" id="fix">Fix</button></p><div id="cardedit"></div>` : ""}
      <div class="ctx">${item.context.map(l =>
        `<p class="${l.source ? "src" : ""}"><b>${esc(l.speaker)}:</b> ${esc(l.text)}</p>`).join("")}</div>
    </article>
    <div class="actions" id="actions">
      <div class="notes-toggle"><button class="linkbtn" id="notebtn">Add a note</button></div>
      <div class="why">
        <div class="chips">${REASONS.map(r => `<button type="button" aria-pressed="false">${r}</button>`).join("")}</div>
        <input id="why" placeholder="Why discard? (optional; helps tune the prompt)" maxlength="500">
      </div>
      <div class="row">
        <button id="discard">Discard</button><button id="keep">Keep</button><button id="star">★ Star</button>
      </div>
    </div>`;
  const actions = document.getElementById("actions");
  const why = document.getElementById("why");
  actions.querySelectorAll(".chips button").forEach(c => c.addEventListener("click", () => {
    const on = c.getAttribute("aria-pressed") !== "true";
    actions.querySelectorAll(".chips button").forEach(o => o.setAttribute("aria-pressed", false));
    c.setAttribute("aria-pressed", on);
    why.value = on ? c.textContent : "";
  }));
  document.getElementById("discard").addEventListener("click", () => {
    if (!actions.classList.contains("asking")) {   // first tap asks why; the second confirms
      actions.classList.add("asking");
      document.getElementById("discard").textContent = "Discard ✓";
      document.getElementById("keep").textContent = "Cancel";
      return;
    }
    decide("item_discard", why.value);
  });
  document.getElementById("keep").addEventListener("click", () => {
    if (actions.classList.contains("asking")) { renderCard(); return; }   // Cancel
    decide("item_keep", why.value);
  });
  document.getElementById("star").addEventListener("click", () => decide("item_star", why.value));
  why.addEventListener("keydown", e => {
    if (e.key === "Enter") actions.classList.contains("asking") ? decide("item_discard", why.value) : decide("item_keep", why.value);
  });
  document.getElementById("notebtn").addEventListener("click", () => {
    actions.classList.add("noting");
    why.placeholder = "A note on why it matters (optional)";
    why.focus();
  });
  document.getElementById("fix")?.addEventListener("click", () =>
    editor(document.getElementById("cardedit"), item.idea, renderCard));
}

// --- Kept unread -------------------------------------------------------------------------------------------
// Captures kept in bulk without reading (pub.evidence.how = 'bulk') get a real verdict once their idea turns out
// to matter: I linked it, it evolves another idea or echoes the archive, it bridges themes, it came up in a
// comparison, or it was said again. ('related' alone doesn't count: Idea Machine finds those for nearly everything.)
// The verdict is an ordinary one; Idea Machine keeps the newest. Discards matter most: I keep by default.

let revisiting = false;
const unread = ev => ev.verdict === "keep" && ev.how === "bulk";

function mattered(ideaId) {
  const why = [];
  const kinds = new Set(state.graph.links.filter(l => id(l.source) === ideaId || id(l.target) === ideaId).map(l => l.kind));
  if (kinds.has("mine")) why.push("you linked it");
  if (kinds.has("evolves")) why.push("it evolves another idea");
  if (kinds.has("archive")) why.push("it echoes your archive");
  if (bridges().has(ideaId)) why.push(`it bridges ${bridges().get(ideaId).spans.join(" \u2194 ")}`);
  if ((state.compared || []).some(p => p.includes(ideaId))) why.push("it came up in a comparison");
  if ((state.ideas[ideaId]?.evidence.length || 0) > 1) why.push("it was said again");
  return why;
}

function secondLook() {
  const out = [];
  for (const d of Object.values(state.ideas)) {
    const evs = d.evidence.filter(unread);
    const why = evs.length ? mattered(d.id) : [];
    if (why.length) evs.forEach(ev => out.push({idea: d, ev, why}));
  }
  return out.sort((a, b) => b.why.length - a.why.length || b.ev.said_at.localeCompare(a.ev.said_at));
}

function renderRevisit() {
  const box = document.getElementById("review");
  const next = secondLook()[0];
  if (!next) { revisiting = false; renderCard(); return; }
  const {idea, ev, why} = next;
  cardId = `look:${ev.item_id}`;
  box.innerHTML = `<article class="card">
      <div class="meta"><span>kept unread</span><span>${esc(ev.kind)}</span><span>${esc(ev.said_by)}</span>
        <span>${when(ev.said_at)}</span></div>
      <p class="quote">“${esc(ev.quote)}”</p>
      <p class="gist">${esc(ev.gist)}</p>
      <p class="idea">In the lattice as: <b>${esc(idea.title)}</b> <button class="linkbtn" id="look-open">Open</button></p>
      <p class="gist">Worth a look now: ${esc(why.join("; "))}.</p>
    </article>
    <div class="actions" id="actions">
      <div class="notes-toggle"><button class="linkbtn" id="look-stop">Done for now</button></div>
      <div class="why">
        <div class="chips">${REASONS.map(r => `<button type="button" aria-pressed="false">${r}</button>`).join("")}</div>
        <input id="why" placeholder="Why discard? (optional; helps tune the prompt)" maxlength="500">
      </div>
      <div class="row"><button id="discard">Discard</button><button id="keep">Keep</button><button id="star">★ Star</button></div>
    </div>`;
  const actions = document.getElementById("actions"), whyBox = document.getElementById("why");
  const answer = async kind => {
    await act({kind, item_id: ev.item_id, note: whyBox.value || undefined});
    toast({item_keep: "Kept", item_star: "Starred", item_discard: "Discarded"}[kind]);
    renderRevisit();
  };
  actions.querySelectorAll(".chips button").forEach(c => c.addEventListener("click", () => {
    const on = c.getAttribute("aria-pressed") !== "true";
    actions.querySelectorAll(".chips button").forEach(o => o.setAttribute("aria-pressed", false));
    c.setAttribute("aria-pressed", on);
    whyBox.value = on ? c.textContent : "";
  }));
  document.getElementById("discard").addEventListener("click", () => {
    if (!actions.classList.contains("asking")) {   // first tap asks why; the second confirms
      actions.classList.add("asking");
      document.getElementById("discard").textContent = "Discard ✓";
      document.getElementById("keep").textContent = "Cancel";
      return;
    }
    answer("item_discard");
  });
  document.getElementById("keep").addEventListener("click", () =>
    actions.classList.contains("asking") ? renderRevisit() : answer("item_keep"));
  document.getElementById("star").addEventListener("click", () => answer("item_star"));
  document.getElementById("look-stop").addEventListener("click", () => { revisiting = false; renderCard(); });
  document.getElementById("look-open").addEventListener("click", () => { setTab("map"); show(idea.id); });
}

const saved = () => toast(navigator.onLine ? "Saved" : "Saved on this device; sends when online");

// Correct an idea or give it context. Corrections are read straight from the events, so they show at once.
function editor(host, idea, onSaved) {
  host.innerHTML = `<div class="editor">
      <label>Title<input id="ed-title" maxlength="120" value="${esc(idea.title)}"></label>
      <label>What the idea is<textarea id="ed-statement" rows="3" maxlength="1000">${esc(idea.statement)}</textarea></label>
      <label>Context (optional): what Claude missed, where it came from<textarea id="ed-note" rows="2"
        maxlength="1000">${esc(idea.note || "")}</textarea></label>
      <div class="edrow"><button id="ed-save">Save</button><button id="ed-cancel">Cancel</button></div></div>`;
  host.querySelector("#ed-cancel").addEventListener("click", () => host.innerHTML = "");
  host.querySelector("#ed-save").addEventListener("click", async () => {
    const title = host.querySelector("#ed-title").value.trim();
    const statement = host.querySelector("#ed-statement").value.trim();
    const note = host.querySelector("#ed-note").value.trim();
    const fix = {};
    if (title !== idea.title) fix.title = title;
    if (statement !== idea.statement) fix.statement = statement;
    if (Object.keys(fix).length) await act({kind: "idea_correct", idea_id: idea.id, ...fix});
    if (note !== (idea.note || "")) await act({kind: "idea_note", idea_id: idea.id, note});
    saved();
    if (fix.title) redrawMap();   // labels and tooltips
    renderList();
    onSaved();
  });
}

async function decide(kind, note) {
  const item = queue()[0];
  if (!item) return;
  await act({kind, item_id: item.id, note: note || undefined, audit: spot().has(item.id) || undefined});
  toast({item_keep: "Kept", item_star: "Starred", item_discard: "Discarded"}[kind]);
  renderCard();
}

document.addEventListener("keydown", e => {   // on a keyboard: k keep, * star, d discard
  if (document.body.dataset.view !== "review" || e.target.tagName === "INPUT" || !state?.review.items.length) return;
  if (e.key === "k") decide("item_keep");
  else if (e.key === "*") decide("item_star");
  else if (e.key === "d") document.getElementById("discard")?.click();
});

// --- Map and list ------------------------------------------------------------------------------------------

const query = () => document.getElementById("search").value.trim().toLowerCase();
const hit = n => (!onlyNew || isNew(n)) && (!query() || (n.title + " " + n.statement).toLowerCase().includes(query()));

function renderCounts() {
  const {nodes, links} = state.graph;
  const fresh = nodes.filter(isNew).length;
  document.getElementById("counts").textContent = `${nodes.length} ideas · ${links.length} connections`;
  const b = document.getElementById("newbtn");
  b.hidden = !fresh && !onlyNew;
  b.textContent = `${fresh} new since your last visit`;
}

// Best first once Idea Machine has scored ideas (pub.idea_scores); otherwise, or by choice, most recent first.
const scored = () => state.graph.nodes.some(n => n.score != null);
const order = () => scored() ? store.get("order") || "best" : "recent";
const score = n => n.score == null ? "" : n.score.toFixed(2);

function renderList() {
  const list = document.getElementById("list");
  const rows = state.graph.nodes.filter(hit);
  const best = order() === "best";
  const recent = (a, b) => (b.last_said || "").localeCompare(a.last_said || "");
  rows.sort(best ? (a, b) => (b.score ?? -1) - (a.score ?? -1) || recent(a, b)
                 : (a, b) => isNew(b) - isNew(a) || recent(a, b));
  list.innerHTML = (scored() ? `<p class="chips" role="group" aria-label="Order">` +
      `<button data-order="best" aria-pressed="${best}">Best first</button>` +
      `<button data-order="recent" aria-pressed="${!best}">Most recent</button></p>` : "") +
    `<table><thead><tr><th>Idea</th>${scored() ? "<th>Score</th>" : ""}<th>From</th><th>Themes</th><th>Evidence</th><th>Last said</th></tr></thead><tbody>` +
    rows.map(n =>
      `<tr class="row" data-id="${n.id}"><td class="c-title">${n.starred ? "★ " : ""}${esc(n.title)}${isNew(n) ? ' <span class="tag">new</span>' : ""}</td>` +
      (scored() ? `<td class="c-score">${score(n)}</td>` : "") +
      `<td class="c-from">${n.origin === "archive" ? esc(n.ref) : n.origin === "mine" ? "added" : "captured"}</td>` +
      `<td class="c-themes">${esc(n.themes.join(", "))}</td><td class="c-ev">${n.evidence || ""}</td>` +
      `<td class="c-when">${day(n.last_said)}</td></tr>`).join("") +
    `</tbody></table>`;
  list.querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", () => { setTab("map"); show(tr.dataset.id); }));
  list.querySelectorAll("[data-order]").forEach(b => b.addEventListener("click", () => {
    store.set("order", b.dataset.order); renderList();
  }));
}

// The theme open in the panel (or the one an open idea was reached from) dims the map's other ideas.
const focusTheme = () => state.graph.themes.find(t => t.id === (shownTheme || fromTheme))?.name;
function filter() {
  const focus = focusTheme();
  const b = bridgesOn ? bridges() : null;
  const lit = n => hit(n) && (!focus || n.themes.includes(focus)) && (!b || b.has(n.id));
  if (mapNodes) mapNodes.attr("opacity", n => lit(n) ? 1 : 0.15);
  if (mapLabels) mapLabels.attr("opacity", n => lit(n) ? 1 : 0.2);
  if (mapEdges) mapEdges.attr("stroke-opacity", l => !b || crossLink(l) ? 1 : 0.1);
  renderList();
  renderTimeline();
}
document.getElementById("search").addEventListener("input", filter);

// --- Time ------------------------------------------------------------------------------------------------
// What keeps coming back: one row per idea that has captures, a dot for each time it came up (colored by theme),
// all on one axis from the first capture to today. Recurring puts the ideas said most often first; Most recent,
// the ones said lately.

function renderTimeline() {
  if (document.body.dataset.view !== "time" || !state) return;
  const box = document.getElementById("timeline");
  const phone = matchMedia("(max-width: 760px)").matches;
  const rows = state.graph.nodes.filter(hit).map(n => ({n, ts: (state.ideas[n.id]?.evidence || [])
      .map(e => ({t: Date.parse(e.said_at), e})).sort((a, b) => a.t - b.t)}))
    .filter(r => r.ts.length);
  const sort = store.get("tsort") || (state.digests?.length ? "week" : "recurring");
  renderDigestBadge();
  if (sort === "week") { renderDigest(box); return; }
  const recurring = sort === "recurring";
  const last = r => r.ts[r.ts.length - 1].t;
  rows.sort(recurring ? (a, b) => b.ts.length - a.ts.length || last(b) - last(a) : (a, b) => last(b) - last(a));
  const label = phone ? 0 : 300;
  box.style.setProperty("--tl-label", phone ? "1fr" : `${label}px`);
  const W = Math.max(160, box.clientWidth - 32 - (phone ? 0 : label + 12)), R = 5;
  const all = rows.flatMap(r => r.ts.map(x => x.t));
  if (!all.length) { box.innerHTML = `<p class="intro">No captured ideas match.</p>`; return; }
  const x = d3.scaleTime().domain([Math.min(...all), Date.now()]).range([R, W - R]).nice();
  const fmt = d3.timeFormat("%b %-d");
  const ticks = x.ticks(phone ? 4 : 8);
  const say = e => `${day(e.said_at)} \u00b7 ${e.said_by}: \u201c${e.quote.length > 140 ? e.quote.slice(0, 139) + "\u2026" : e.quote}\u201d`;
  box.innerHTML = `<p class="chips" role="group" aria-label="Order">` +
      `<button data-tsort="week" aria-pressed="false">Week</button>` +
      `<button data-tsort="recurring" aria-pressed="${recurring}">Recurring</button>` +
      `<button data-tsort="recent" aria-pressed="${!recurring}">Most recent</button></p>` +
    `<p class="intro">Each dot is a time the idea came up, colored by theme. ${rows.length} ideas with captures.</p>` +
    `<div class="axis"><span class="pad"></span><svg width="${W}" height="20" aria-hidden="true">` +
      ticks.map(t => `<text x="${x(t)}" y="14" text-anchor="middle">${fmt(t)}</text>`).join("") + `</svg></div>` +
    rows.map(({n, ts}) => `<div class="trow" data-id="${n.id}">` +
      `<div class="tl">${n.starred ? "\u2605 " : ""}${esc(n.title)} <span class="n">\u00b7 ${ts.length}</span>` +
        `${isNew(n) ? ' <span class="tag">new</span>' : ""}</div>` +
      `<svg width="${W}" height="${2 * R + 4}" role="img" aria-label="${esc(n.title)}: said ${ts.length} times">` +
        ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${2 * R + 4}" stroke="var(--border)"/>`).join("") +
        `<line x1="${x(ts[0].t)}" x2="${x(ts[ts.length - 1].t)}" y1="${R + 2}" y2="${R + 2}" stroke="var(--edge)"/>` +
        ts.map(({t, e}) => `<circle cx="${x(t)}" cy="${R + 2}" r="${R}" style="fill:${themeColor(n)}" stroke="var(--surface-1)">` +
          `<title>${esc(say(e))}</title></circle>`).join("") +
      `</svg></div>`).join("");
  box.querySelectorAll("[data-tsort]").forEach(b => b.addEventListener("click", () => {
    store.set("tsort", b.dataset.tsort); renderTimeline();
  }));
  box.querySelectorAll(".trow").forEach(r => r.addEventListener("click", () => { setTab("map"); show(r.dataset.id); }));
}
// --- The weekly digest -------------------------------------------------------------------------------------
// Idea Machine's weekly read of what the lattice gained (pub.digests): what kept coming up, what converges, sleepers,
// projects forming, what a stranger would value. Each point cites its ideas (tap one for the map) and takes ★ (worth
// surfacing) or "Not useful": digest_star / digest_dismiss, the latest wins. A digest can vanish if its speech is
// forgotten, so the week shown falls back to the newest.

const KIND = {recurring: "Keeps coming up", convergence: "Converging", sleeper: "Sleeper", project: "Project forming",
              outside_value: "Worth sharing"};
let digestWeek = null;   // week_start shown; null: the newest

// "Draft with Claude": opens claude.ai with the request written, where the connector's draft_material gathers the
// ideas and Claude asks what to make. The text is also copied, in case the app opens without it.
function draftLink(what) {
  const ask = `Let's draft something from ${what}. Use draft_material, then ask me what to make, for whom and how long.`;
  return `<a class="linkbtn draft" target="_blank" rel="noopener" data-ask="${esc(ask)}"
    href="https://claude.ai/new?q=${encodeURIComponent(ask)}">Draft with Claude</a>`;
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.draft");
  if (a) navigator.clipboard?.writeText(a.dataset.ask).catch(() => {});
});

function renderDigestBadge() {
  const newest = state.digests?.[0];
  document.getElementById("tbadge").textContent = newest && newest.id > +(store.get("digest-seen") || 0) ? "\u2022" : "";
}

function renderDigest(box) {
  const ds = state.digests || [];
  const at = Math.max(0, ds.findIndex(d => d.week_start === digestWeek));
  const d = ds[at];
  const chips = `<p class="chips" role="group" aria-label="Order"><button data-tsort="week" aria-pressed="true">Week</button>` +
    `<button data-tsort="recurring" aria-pressed="false">Recurring</button>` +
    `<button data-tsort="recent" aria-pressed="false">Most recent</button></p>`;
  if (!d) {
    box.innerHTML = chips + `<p class="intro">Each Monday Idea Machine writes a digest of the week before: what kept
      coming up, what converges, what matters more than it seemed. None yet.</p>`;
  } else {
    if (at === 0) { store.set("digest-seen", String(d.id)); renderDigestBadge(); }
    const start = new Date(d.week_start + "T00:00"), end = new Date(start.getTime() + 6 * 864e5);
    const span = `${day(start.toISOString())} \u2013 ${day(end.toISOString())}`;
    box.innerHTML = chips + `<div class="digest">
      <div class="dnav"><button id="d-prev" ${at >= ds.length - 1 ? "disabled" : ""}>\u2039 Earlier</button>
        <b>${span}</b><button id="d-next" ${at === 0 ? "disabled" : ""}>Later \u203a</button></div>
      <p class="dsum">${esc(d.summary)}</p>
      ${d.points.map(p => `<article class="point${p.mine === "dismiss" ? " dismissed" : ""}">
        <span class="tag">${esc(KIND[p.kind] || p.kind)}</span>
        <h3>${p.mine === "star" ? "\u2605 " : ""}${esc(p.title)}</h3><p>${esc(p.body)}</p>
        <div class="ideas">${p.idea_ids.filter(i => state.ideas[i]).map(i =>
          `<button data-go="${i}">${esc(state.ideas[i].title)}</button>`).join("")}</div>
        <div class="prow"><button data-p="${p.point}" data-r="digest_star" aria-pressed="${p.mine === "star"}">\u2605 Worth it</button>
          <button data-p="${p.point}" data-r="digest_dismiss" aria-pressed="${p.mine === "dismiss"}">Not useful</button>
          ${draftLink(`point ${p.point} ("${p.title}") of my Lattice weekly digest for the week of ${d.week_start}`)}</div>
      </article>`).join("")}</div>`;
    box.querySelector("#d-prev").addEventListener("click", () => { digestWeek = ds[at + 1].week_start; renderTimeline(); });
    box.querySelector("#d-next").addEventListener("click", () => { digestWeek = ds[at - 1].week_start; renderTimeline(); });
    box.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { setTab("map"); show(b.dataset.go); }));
    box.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", async () => {
      if (b.getAttribute("aria-pressed") === "true") return;
      await act({kind: b.dataset.r, digest_id: d.id, point: +b.dataset.p});
      renderTimeline();
    }));
  }
  box.querySelectorAll("[data-tsort]").forEach(b => b.addEventListener("click", () => {
    store.set("tsort", b.dataset.tsort); renderTimeline();
  }));
}

addEventListener("resize", () => { clearTimeout(renderTimeline.t); renderTimeline.t = setTimeout(renderTimeline, 150); });

// Size is the idea's weight: its evidence, and a star counts as two more pieces.
const weight = n => n.evidence + (n.starred ? 2 : 0);
const radius = n => 5 + 3 * Math.sqrt(weight(n));

// Themes take the 8 categorical slots in the server's stable order (pinned first, then oldest), so a theme keeps
// its color as the lattice grows. Themes past the eighth share the neutral "other" color, and an idea in several
// themes takes the color of the first in that same order.
const SLOTS = 8;
function themeSlot(name) {
  const i = state.graph.themes.findIndex(t => t.name === name);
  return i >= 0 && i < SLOTS ? `var(--series-${i + 1})` : "var(--unthemed)";
}
function themeColor(n) {
  const first = state.graph.themes.find(t => n.themes.includes(t.name));
  return first ? themeSlot(first.name) : "var(--unthemed)";
}

// Bridge ideas: where interests meet. An idea bridges when it touches two or more themes, by belonging to several
// or by being connected (any kind of link) to an idea in a theme it isn't in. Strongest first: the most themes
// touched, then the most cross-theme links, then the score.
let bridgesOn = false, bridgeCache = null;
function bridges() {
  if (bridgeCache?.state === state) return bridgeCache.map;
  const themesOf = Object.fromEntries(state.graph.nodes.map(n => [n.id, n.themes]));
  const map = new Map();
  for (const n of state.graph.nodes) {
    const touched = new Set(n.themes);
    let cross = 0;
    for (const l of state.graph.links) {
      const other = id(l.source) === n.id ? id(l.target) : id(l.target) === n.id ? id(l.source) : null;
      if (!other || !themesOf[other]?.length) continue;
      const theirs = themesOf[other];
      if (!theirs.some(t => n.themes.includes(t))) cross++;
      theirs.forEach(t => touched.add(t));
    }
    if (touched.size >= 2 && (n.themes.length >= 2 || cross))
      map.set(n.id, {spans: state.graph.themes.map(t => t.name).filter(t => touched.has(t)), cross,
                     rank: touched.size * 100 + cross * 10 + (n.score ?? 0)});
  }
  bridgeCache = {state, map};
  return map;
}
// A link crosses between themes when its two ideas share none (and both have one).
const crossLink = l => {
  const a = state.graph.nodes.find(n => n.id === id(l.source))?.themes || [];
  const b = state.graph.nodes.find(n => n.id === id(l.target))?.themes || [];
  return a.length && b.length && !a.some(t => b.includes(t));
};

let mapMode = store.get("mapmode") === "territories" ? "territories" : "graph";
let mapNodes = null, drawn = false, shown = null, shownTheme = null, fromTheme = null;
let mapZoom = null, mapSvg = null, mapBox = null, mapLabels = null, mapEdges = null;   // to zoom to a theme's ideas
const placed = new Map();   // where each idea was last drawn, so a redraw doesn't scatter the map
let view = null;            // the zoom, kept across redraws

function redrawMap() {
  drawn = false;
  document.getElementById("graph").replaceChildren();
  if (document.body.dataset.view === "map") drawMap();
}

function drawMap() {
  if (drawn || !state) return;
  drawn = true;
  const {nodes, links, themes} = state.graph;
  const order = themes.map(t => t.name);
  const slot = themeSlot, color = themeColor;
  const territories = mapMode === "territories";
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mapMode));
  document.getElementById("legend").innerHTML =
    themes.slice(0, SLOTS).map(t => `<span><i class="sw" style="background:${slot(t.name)}"></i>${esc(t.name)}` +
      `${t.proposed && !t.pinned ? " <em>(proposed)</em>" : ""} · ${t.ideas}</span>`).join("") +
    `<span><i class="sw" style="background:var(--unthemed)"></i>${themes.length > SLOTS ? "Other or no theme" : "No theme"}</span>` +
    `<span><i class="sw" style="border:1.5px dashed var(--text-primary)"></i>new since your last visit</span>` +
    (territories ? `<span>Each area takes the theme of its nearest idea</span>` :
    `<span><i class="ln"></i>evolves</span><span><i class="ln" style="border-top-style:dashed"></i>archive link</span>` +
    `<span><i class="ln" style="border-top-width:1px;border-color:var(--edge)"></i>related</span>` +
    `<span><i class="ln" style="border-color:var(--text-primary);border-top-style:dotted"></i>your link</span>`);
  if (!shown && !shownTheme) renderThemes();

  const degree = Object.fromEntries(nodes.map(n => [n.id, 0]));
  links.forEach(l => { degree[id(l.source)]++; degree[id(l.target)]++; });
  const labelled = new Set([...nodes].sort((a, b) => degree[b.id] - degree[a.id]).slice(0, 12).map(n => n.id));
  // Starred ideas are always named, and new ones too while there are few enough to read.
  const fresh = nodes.filter(isNew);
  nodes.forEach(n => { if (n.starred || (fresh.length <= 12 && isNew(n))) labelled.add(n.id); });

  const box = document.getElementById("graph");
  const W = box.clientWidth, H = box.clientHeight;
  const svg = d3.select(box).append("svg").attr("width", W).attr("height", H)
    .attr("role", "img").attr("aria-label", "Map of ideas and their connections");
  svg.append("defs").append("marker").attr("id", "arrow").attr("viewBox", "0 0 10 10").attr("refX", 16)
    .attr("refY", 5).attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
    .append("path").attr("d", "M0,0L10,5L0,10z").attr("fill", css("--edge-strong"));
  const g = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => { view = e.transform; g.attr("transform", e.transform); });
  [mapZoom, mapSvg, mapBox] = [zoom, svg, {W, H}];
  svg.call(zoom);

  const edge = g.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", l => l.kind === "related" ? css("--edge") : l.kind === "mine" ? css("--text-primary") : css("--edge-strong"))
    .attr("stroke-width", l => l.kind === "related" ? 1 : 2)
    .attr("stroke-dasharray", l => l.kind === "archive" ? "4 3" : l.kind === "mine" ? "1 3" : null)
    .attr("stroke-linecap", l => l.kind === "mine" ? "round" : null)
    .attr("marker-end", l => l.kind === "evolves" ? "url(#arrow)" : null);
  const ring = g.append("g").selectAll("circle").data(fresh).join("circle")
    .attr("r", n => radius(n) + 4).attr("fill", "none").style("stroke", "var(--text-primary)")
    .attr("stroke-width", 1.5).attr("stroke-dasharray", "3 2");
  const node = g.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", radius)
    .style("fill", n => n.origin === "archive" ? "var(--surface-1)" : color(n))
    .style("stroke", n => n.origin === "archive" ? color(n) : "var(--surface-1)")
    .attr("stroke-width", n => n.origin === "archive" ? 2.5 : 2)
    .style("cursor", "pointer")
    .on("mousemove", (e, n) => { const t = document.getElementById("tip");
      t.style.display = "block"; t.style.left = e.clientX + 12 + "px"; t.style.top = e.clientY + 12 + "px";
      t.textContent = `${n.starred ? "★ " : ""}${n.title}${n.evidence ? ` · ${n.evidence} piece${n.evidence > 1 ? "s" : ""} of evidence` : ""}${isNew(n) ? " · new" : ""}`; })
    .on("mouseleave", () => { document.getElementById("tip").style.display = "none"; })
    .on("click", (e, n) => show(n.id))
    .call(d3.drag().filter(() => !territories)
      .on("start", (e, n) => { if (!e.active) sim.alphaTarget(0.2).restart(); n.fx = n.x; n.fy = n.y; })
      .on("drag", (e, n) => { n.fx = e.x; n.fy = e.y; })
      .on("end", (e, n) => { if (!e.active) sim.alphaTarget(0); n.fx = null; n.fy = null; }));
  const label = g.append("g").selectAll("text").data(nodes.filter(n => labelled.has(n.id))).join("text")
    .text(n => `${n.starred ? "★ " : ""}${n.title}`).attr("dx", 10).attr("dy", 4);

  // Where each idea wants to be. With Idea Machine's semantic positions (pub.idea_positions), ideas sit by
  // meaning and themes show as the colors that gather; an idea without one goes to the middle of its theme's
  // placed ideas. Without positions, each theme gets an anchor on a ring and pulls its ideas toward it.
  const R = Math.min(W, H) * 0.42, Rx = W * 0.42, Ry = H * 0.42;   // semantic positions fill the box
  const semantic = nodes.filter(n => n.pos).length >= nodes.length / 2;
  let home;
  if (semantic) {
    const centre = {};
    for (const name of order) {
      const ps = nodes.filter(n => n.pos && n.themes.includes(name)).map(n => n.pos);
      if (ps.length) centre[name] = [d3.mean(ps, p => p[0]), d3.mean(ps, p => p[1])];
    }
    home = n => { const p = n.pos || centre[order.find(name => centre[name] && n.themes.includes(name))] || [0, 0];
                  return [W / 2 + Rx * p[0], H / 2 + Ry * p[1]]; };
  } else {
    const anchor = Object.fromEntries(order.map((name, i) =>
      [name, [W / 2 + R * 0.85 * Math.cos(2 * Math.PI * i / order.length - Math.PI / 2),
              H / 2 + R * 0.85 * Math.sin(2 * Math.PI * i / order.length - Math.PI / 2)]]));
    home = n => { const t = order.find(name => n.themes.includes(name)); return t ? anchor[t] : [W / 2, H / 2]; };
  }
  nodes.forEach(n => { [n.x, n.y] = placed.get(n.id) || home(n); });
  const pull = semantic ? 0.3 : 0.12;
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(n => n.id).distance(l => l.kind === "related" ? 70 : 50)
      .strength(semantic ? 0.05 : 0.3))
    .force("charge", d3.forceManyBody().strength(semantic ? -20 : -45))
    .force("x", d3.forceX(n => home(n)[0]).strength(pull)).force("y", d3.forceY(n => home(n)[1]).strength(pull))
    .force("collide", d3.forceCollide(n => radius(n) + 2))
    .stop();
  const place = () => {
    edge.attr("x1", l => l.source.x).attr("y1", l => l.source.y).attr("x2", l => l.target.x).attr("y2", l => l.target.y);
    node.attr("cx", n => n.x).attr("cy", n => n.y);
    ring.attr("cx", n => n.x).attr("cy", n => n.y);
    label.attr("x", n => n.x).attr("y", n => n.y);
    nodes.forEach(n => placed.set(n.id, [n.x, n.y]));
  };
  sim.tick(300);   // settle before the first paint, so the map doesn't jiggle into place
  place();
  let shownLabels = label;
  if (territories) shownLabels = drawTerritories(g, nodes, order, {edge, node, label});
  if (view) svg.call(zoom.transform, view);
  else {
    // Start zoomed to fit every idea: on a phone the layout is wider than the screen.
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y), pad = 24;
    const [x0, x1, y0, y1] = [Math.min(...xs) - pad, Math.max(...xs) + pad, Math.min(...ys) - pad, Math.max(...ys) + pad];
    const k = Math.min(1.2, W / (x1 - x0), H / (y1 - y0));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k));
  }
  sim.on("tick", place);   // dragging restarts it
  mapNodes = node;
  mapLabels = shownLabels;
  mapEdges = edge;
  filter();
}

// Territories: the same places as the graph, read as a map. Every spot near an idea takes the color of the
// nearest idea's theme (Voronoi cells, clipped to a radius around the ideas so empty ground stays empty), so themes
// show as countries without overlapping. The edges go, the dots shrink, and only theme names (where each theme is
// densest) and a few of the best ideas are labelled, pushed apart so they don't collide.
function drawTerritories(g, nodes, order, {edge, node, label}) {
  edge.attr("display", "none");
  label.attr("display", "none");
  node.attr("r", n => 3 + Math.sqrt(weight(n))).attr("stroke-width", n => n.origin === "archive" ? 1.5 : 1);
  const reach = 38, pad = 2 * reach;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const bounds = [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad];
  const voronoi = d3.Delaunay.from(nodes, n => n.x, n => n.y).voronoi(bounds);
  const clip = `lands-${Date.now()}`;
  g.insert("clipPath", ":first-child").attr("id", clip).selectAll("circle").data(nodes).join("circle")
    .attr("cx", n => n.x).attr("cy", n => n.y).attr("r", reach);
  g.insert("g", ":first-child").attr("clip-path", `url(#${clip})`).selectAll("path").data(nodes).join("path")
    .attr("d", (n, i) => voronoi.renderCell(i)).style("fill", n => themeColor(n))
    .attr("fill-opacity", n => n.themes.length ? 0.22 : 0.1);

  // Labels: each theme at its densest spot (the idea with the most theme-mates nearby, averaged with them).
  const spots = [];
  for (const name of order.slice(0, SLOTS)) {
    const mine = nodes.filter(n => n.themes.includes(name));
    if (!mine.length) continue;
    const near = n => mine.filter(m => Math.hypot(m.x - n.x, m.y - n.y) < 90);
    const core = near(mine.reduce((best, n) => near(n).length > near(best).length ? n : best, mine[0]));
    spots.push({kind: "land", text: name, x: d3.mean(core, n => n.x), y: d3.mean(core, n => n.y)});
  }
  const phone = matchMedia("(max-width: 760px)").matches;
  const top = [...nodes].sort((a, b) => b.starred - a.starred || (b.score ?? -1) - (a.score ?? -1) || b.evidence - a.evidence)
    .slice(0, phone ? 4 : 8);
  for (const n of top) spots.push({kind: "spot", text: `${n.starred ? "\u2605 " : ""}${n.title}`, x: n.x + 8, y: n.y, n});
  const short = t => t.length > 28 ? t.slice(0, 27).trimEnd() + "\u2026" : t;
  // Greedy placement: theme names first, nudged up or down until clear; idea labels only where there's room.
  const placedBoxes = [];
  const boxOf = (sp, y) => {
    const w = short(sp.text).length * (sp.kind === "land" ? 7.6 : 6), h = sp.kind === "land" ? 16 : 13;
    const x0 = sp.kind === "land" ? sp.x - w / 2 : sp.x;
    return [x0, y - h + 3, x0 + w, y + 3];
  };
  const clear = b => placedBoxes.every(o => b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]);
  const shown = [];
  for (const sp of spots) {
    const tries = sp.kind === "land" ? [0, -18, 18, -36, 36, -54, 54] : [0, -14, 14];
    const dy = tries.find(d => clear(boxOf(sp, sp.y + d)));
    if (dy === undefined && sp.kind === "spot") continue;
    const y = sp.y + (dy ?? 0);
    placedBoxes.push(boxOf(sp, y));
    shown.push({...sp, y});
  }
  g.append("g").selectAll("text").data(shown.filter(sp => sp.kind === "land")).join("text").attr("class", "land")
    .attr("x", sp => sp.x).attr("y", sp => sp.y).attr("text-anchor", "middle").text(sp => short(sp.text));
  return g.append("g").selectAll("text").data(shown.filter(sp => sp.kind === "spot").map(sp => Object.assign(sp.n, {_ly: sp.y})))
    .join("text").attr("class", "spot").attr("x", n => n.x).attr("y", n => n._ly).attr("dx", 8).attr("dy", 4)
    .text(n => short(`${n.starred ? "\u2605 " : ""}${n.title}`));
}

document.getElementById("bridgebtn").addEventListener("click", e => {
  bridgesOn = !bridgesOn;
  e.currentTarget.setAttribute("aria-pressed", bridgesOn);
  filter();
  if (!shown && !shownTheme) renderThemes();   // the Bridges section leads the panel while it's on
});

document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
  mapMode = b.dataset.mode;
  store.set("mapmode", mapMode);
  redrawMap();
}));

document.getElementById("legendbtn").addEventListener("click", e => {
  const open = document.getElementById("legend").classList.toggle("open");
  e.target.setAttribute("aria-expanded", open);
});

// The bottom sheet (phones only; on a wide screen the panel is a column and these do nothing visible).
const LEVELS = ["peek", "half", "full"];
const sheetLevel = () => document.getElementById("panel").dataset.sheet;
function sheet(level) {
  const panel = document.getElementById("panel");
  panel.dataset.sheet = level;
  const size = document.getElementById("sheetsize");
  size.textContent = level === "full" ? "\u2921" : "\u2922";
  size.setAttribute("aria-label", level === "full" ? "Shrink" : "Expand");
}
document.getElementById("sheetsize").addEventListener("click", () => sheet(sheetLevel() === "full" ? "half" : "full"));
document.getElementById("sheetclose").addEventListener("click", () => sheet("peek"));
(() => {   // drag the bar up or down a level; a tap on a lowered sheet opens it
  const bar = document.getElementById("sheetbar");
  let y0 = null;
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    y0 = e.clientY;
    bar.setPointerCapture(e.pointerId);   // the release counts even if the finger has left the bar
  });
  bar.addEventListener("pointerup", e => {
    if (y0 === null) return;
    const dy = e.clientY - y0, i = LEVELS.indexOf(sheetLevel());
    y0 = null;
    if (dy < -30) sheet(LEVELS[Math.min(i + 1, 2)]);
    else if (dy > 30) sheet(LEVELS[Math.max(i - 1, 0)]);
    else if (sheetLevel() === "peek") sheet("half");
  });
  bar.addEventListener("pointercancel", () => { y0 = null; });
})();

// The panel with nothing selected: themes, with Pin / Reject for the proposals.
function renderThemes() {
  shown = shownTheme = fromTheme = null;
  filter();
  document.getElementById("sheettitle").textContent = "Themes";
  document.getElementById("panelbody").innerHTML =
    `<p class="hint">Tap an idea to see its evidence. Outlined circles come from the archive; filled ones were
     captured from conversation. Size grows with evidence and a star; a dashed ring marks what's new since your
     last visit.</p><h2>Themes</h2>` +
    state.graph.themes.map(t => `<div class="theme-row" data-id="${t.id}" role="button" tabindex="0"
        aria-label="Open ${esc(t.name)}"><span class="name">${esc(t.name)}
        <span class="muted">· ${t.ideas}${t.rejected ? " · rejected (next run)" : t.pinned ? (t.proposed ? " · pinned" : "")
          : t.proposed ? " · proposed" : ""}</span></span>` +
      (t.proposed && !t.pinned && !t.rejected ? `<button data-act="pin_theme">Pin</button><button data-act="reject_theme">Reject</button>` : "") +
      `<span class="chev" aria-hidden="true">›</span></div>`).join("");
  const top = [...bridges()].sort((a, b) => b[1].rank - a[1].rank).slice(0, 10);
  const bridgeHtml = top.length ? `<h2 class="bridges-h">Bridge ideas</h2><p class="hint">Ideas that connect themes:
      in more than one, or linked across. Often where your interests meet.</p>` +
    top.map(([nid, br]) => `<div class="ev"><button class="linkbtn idea-link" data-go="${nid}">${esc(state.ideas[nid]?.title)}</button>` +
      `<div class="by">${br.spans.map(esc).join(" \u2194 ")}</div></div>`).join("") : "";
  const body = document.getElementById("panelbody");
  if (bridgesOn) body.insertAdjacentHTML("afterbegin", bridgeHtml); else body.insertAdjacentHTML("beforeend", bridgeHtml);
  body.querySelectorAll(".idea-link[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));
  document.querySelectorAll(".theme-row button").forEach(b => b.addEventListener("click", async e => {
    e.stopPropagation();
    await act({kind: b.dataset.act, theme_id: b.closest(".theme-row").dataset.id});
    renderThemes();
  }));
  document.querySelectorAll(".theme-row").forEach(r => {
    r.addEventListener("click", () => showTheme(r.dataset.id));
    r.addEventListener("keydown", e => { if (e.key === "Enter") showTheme(r.dataset.id); });
  });
}

// One theme: what it is, its ideas best first, and Pin / Reject with them in view. The map zooms to its ideas.
function showTheme(themeId) {
  const t = state.graph.themes.find(x => x.id === themeId);
  if (!t) { renderThemes(); return; }
  shown = fromTheme = null;
  shownTheme = themeId;
  const ideas = state.graph.nodes.filter(n => n.themes.includes(t.name))
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || b.starred - a.starred || b.evidence - a.evidence);
  const status = t.rejected ? "rejected (next run)" : t.pinned ? "pinned" : t.proposed ? "proposed by clustering" : "";
  document.getElementById("sheettitle").textContent = t.name;
  if (sheetLevel() === "peek") sheet("half");
  const body = document.getElementById("panelbody");
  body.scrollTop = 0;
  body.innerHTML = `<p><button id="back">← Themes</button>` +
      (t.proposed && !t.pinned && !t.rejected ? ` <button data-act="pin_theme">Pin</button> <button data-act="reject_theme">Reject</button>` : "") +
      (t.pinned && t.proposed ? ` <button data-act="unpin_theme">Unpin</button>` : "") + `</p>` +
    `<h2>${esc(t.name)}</h2>` +
    (t.description ? `<p class="statement">${esc(t.description)}</p>` : "") +
    `<p class="meta">${ideas.length} idea${ideas.length === 1 ? "" : "s"}${status ? ` · ${status}` : ""}` +
      (ideas.length > 1 ? ` · ${draftLink(`my Lattice theme "${t.name}"`)}` : "") + `</p>` +
    ideas.map(n => `<div class="ev"><button class="linkbtn idea-link" data-go="${n.id}">${n.starred ? "★ " : ""}${esc(n.title)}</button>` +
      `<div class="by">${n.score != null ? `score ${n.score.toFixed(2)} · ` : ""}${n.evidence ? `${n.evidence} evidence · ` : ""}` +
      `${n.origin === "archive" ? "archive" : n.origin === "mine" ? "added by you" : day(n.last_said)}${isNew(n) ? " \u00b7 new" : ""}` +
      `${(() => { const o = bridges().get(n.id)?.spans.filter(x => x !== t.name) || [];
                  return o.length ? ` \u00b7 \u2194 ${o.map(esc).join(", ")}` : ""; })()}</div></div>`).join("");
  body.querySelector("#back").addEventListener("click", renderThemes);
  body.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    await act({kind: b.dataset.act, theme_id: themeId});
    showTheme(themeId);
  }));
  body.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go, themeId)));
  filter();
  zoomTo(ideas);
}

// Fit the map to some ideas, leaving room for the sheet on a phone.
function zoomTo(nodes) {
  if (!mapZoom || !nodes.length || nodes.some(n => n.x == null)) return;
  const {W, H} = mapBox, pad = 40;
  // The sheet may still be sliding, so go by the height it's heading for (CSS: 55dvh half, 52px peek).
  const phone = matchMedia("(max-width: 760px)").matches;
  const covered = !phone ? 0 : sheetLevel() === "half" ? innerHeight * 0.55 : sheetLevel() === "full" ? H : 52;
  const h = Math.max(120, H - covered);
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const [x0, x1, y0, y1] = [Math.min(...xs) - pad, Math.max(...xs) + pad, Math.min(...ys) - pad, Math.max(...ys) + pad];
  const k = Math.min(2.5, W / (x1 - x0), h / (y1 - y0));
  mapSvg.transition().duration(400).call(mapZoom.transform,
    d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, h / 2 - k * (y0 + y1) / 2).scale(k));
}

function show(ideaId, viaTheme) {
  const d = state.ideas[ideaId];
  if (!d) { renderThemes(); return; }
  if (viaTheme !== undefined) fromTheme = viaTheme;
  else if (shown !== ideaId) fromTheme = null;   // reached from the map or the list, not from a theme
  shown = ideaId;
  shownTheme = null;
  const backTo = state.graph.themes.find(t => t.id === fromTheme);
  const title = nid => state.ideas[nid]?.title ?? "(an idea no longer in the lattice)";
  const kinds = {evolves: "evolves", archive: "archive link", related: "related", mine: "your link"};
  const conns = state.graph.links.filter(l => id(l.source) === ideaId || id(l.target) === ideaId)
    .map(l => ({other: id(l.source) === ideaId ? id(l.target) : id(l.source), kind: l.kind}));
  const verdictWord = {keep: "kept", star: "★", discard: "discarded"};
  document.getElementById("sheettitle").textContent = d.title;
  if (sheetLevel() === "peek") sheet("half");   // on a phone, tapping an idea opens the sheet
  document.getElementById("panelbody").scrollTop = 0;
  document.getElementById("panelbody").innerHTML =
    `<p><button id="back">← ${backTo ? esc(backTo.name) : "Themes"}</button> <button id="staridea">${d.starred ? "★ Starred" : "☆ Star"}</button>` +
    ` <button id="editidea">Edit</button> <button id="linkidea">Link to…</button></p>` +
    `<div id="paneledit"></div><div id="linker" hidden></div>` +
    `<h2>${esc(d.title)}</h2><p class="statement">${esc(d.statement)}</p>` +
    (d.my_note ? `<p class="notes">Your note: ${esc(d.my_note)}</p>` : "") +
    (d.corrected ? `<p class="meta">${{archive: "Originally", mine: "You first wrote"}[d.origin] || "Claude heard"}: ` +
      `<i>${esc(d.claude_title)}</i> — ${esc(d.claude_statement)}</p>` : "") +
    `<p class="meta">${d.origin === "archive" ? `From the archive (${esc(d.ref)})` : d.origin === "mine" ? "Added by you"
      : "Captured from conversation"}` +
    `${d.themes.length ? ` · ${esc(d.themes.join(", "))}` : ""}</p>` +
    (d.notes ? `<p class="notes">${esc(d.notes)}</p>` : "") +
    (bridges().has(ideaId) ? `<p class="meta">Bridges ${bridges().get(ideaId).spans.map(esc).join(" \u2194 ")}</p>` : "") +
    (d.ranking ? `<p class="meta">Score ${d.ranking.score.toFixed(2)} · generality ${d.ranking.generality} · ` +
      `novelty ${d.ranking.novelty} · compression ${d.ranking.compression} · ` +
      `interest to a stranger ${d.ranking.outside_value} (of 5)${d.ranking.why ? `<br>${esc(d.ranking.why)}` : ""}</p>` : "") +
    (conns.length ? `<div class="ev"><b>Connected to</b>${conns.map(c => `<div class="conn">
        <button class="linkbtn" data-go="${c.other}">${esc(title(c.other))}</button>
        <span class="k">${kinds[c.kind] || esc(c.kind)}</span>
        ${c.kind === "mine" ? `<button class="linkbtn" data-unlink="${c.other}">Unlink</button>` : ""}</div>`).join("")}</div>` : "") +
    d.evidence.map(ev => `<div class="ev"><q>${esc(ev.quote)}</q>` +
      `<div class="by">${esc(ev.said_by)} · ${day(ev.said_at)} · ${esc(ev.kind)}` +
      `${ev.verdict ? ` · ${verdictWord[ev.verdict] || ev.verdict}${unread(ev) ? " unread" : ""}` : ""}</div>` +
      (ev.verdict && !unread(ev) ? "" : `<div class="verdicts" data-item="${ev.item_id}"><button data-v="item_keep">Keep</button>` +
        `<button data-v="item_star">★ Star</button><button data-v="item_discard">Discard</button></div>`) +
      `</div>`).join("");
  const panel = document.getElementById("panel");
  panel.querySelector("#back").addEventListener("click", () => backTo ? showTheme(backTo.id) : renderThemes());
  filter();
  panel.querySelector("#editidea").addEventListener("click", () =>
    editor(panel.querySelector("#paneledit"), {id: ideaId, title: d.title, statement: d.statement, note: d.my_note},
           () => show(ideaId)));
  panel.querySelector("#staridea").addEventListener("click", async () => {
    await act({kind: d.starred ? "unstar" : "star", idea_id: ideaId});
    redrawMap(); renderList(); show(ideaId);
  });
  panel.querySelector("#linkidea").addEventListener("click", () => linker(ideaId));
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));
  panel.querySelectorAll("[data-unlink]").forEach(b => b.addEventListener("click", async () => {
    await act({kind: "unlink", idea_id: ideaId, other_idea_id: b.dataset.unlink});
    saved(); redrawMap(); renderCounts(); show(ideaId);
  }));
  // A verdict on a capture, in place: the same events as the Review tab.
  panel.querySelectorAll(".verdicts button").forEach(b => b.addEventListener("click", async () => {
    await act({kind: b.dataset.v, item_id: b.parentElement.dataset.item});
    renderReview(); show(ideaId);
  }));
}

// Link this idea to another: type to find it, tap to link.
function linker(ideaId) {
  const box = document.getElementById("linker");
  box.hidden = false;
  box.innerHTML = `<input id="linkq" type="search" placeholder="Find the idea to link to" aria-label="Find an idea to link to">
                   <div id="linkhits"></div>`;
  const q = box.querySelector("#linkq");
  const list = () => {
    const s = q.value.trim().toLowerCase();
    const linked = new Set(state.graph.links.filter(l => l.kind === "mine" &&
      (id(l.source) === ideaId || id(l.target) === ideaId)).map(l => id(l.source) === ideaId ? id(l.target) : id(l.source)));
    const hits = s ? state.graph.nodes.filter(n => n.id !== ideaId && !linked.has(n.id) &&
                                               (n.title + " " + n.statement).toLowerCase().includes(s)).slice(0, 8) : [];
    box.querySelector("#linkhits").innerHTML = hits.map(n =>
      `<button class="linkbtn" data-to="${n.id}">${esc(n.title)}</button>`).join("") ||
      (s ? `<span class="muted">No idea matches.</span>` : "");
    box.querySelectorAll("[data-to]").forEach(b => b.addEventListener("click", async () => {
      await act({kind: "link", idea_id: ideaId, other_idea_id: b.dataset.to});
      saved(); redrawMap(); renderCounts(); show(ideaId);
    }));
  };
  q.addEventListener("input", list);
  q.focus();
}

// --- Add an idea ----------------------------------------------------------------------------------------------
// My own idea, straight into the lattice: an idea_add event with an id made here, so it shows at once (and can be
// starred or linked) before Idea Machine embeds, places and files it on its next run.
const addDlg = document.getElementById("adddlg");
document.getElementById("addbtn").addEventListener("click", () => {
  addDlg.querySelector("form").reset();
  addDlg.showModal();
  document.getElementById("add-title").focus();
});
addDlg.addEventListener("close", async () => {
  if (addDlg.returnValue !== "save" || !state) return;
  const title = document.getElementById("add-title").value.trim();
  const statement = document.getElementById("add-statement").value.trim();
  const note = document.getElementById("add-note").value.trim();
  if (!title || !statement) return;
  const ideaId = crypto.randomUUID();
  await act({kind: "idea_add", idea_id: ideaId, title, statement, note: note || undefined});
  toast("Added. Idea Machine places it on its next run");
  renderCounts(); renderList(); redrawMap();
  setTab("map"); show(ideaId);
});

function renderAll() {
  renderStatus();
  renderReview();
  renderCounts();
  renderList();
  renderTimeline();
  renderDigestBadge();
  redrawMap();
  if (shown) show(shown); else if (shownTheme) showTheme(shownTheme); else renderThemes();
  renderSync();
}

// --- Start -------------------------------------------------------------------------------------------------

// #review, #map or #list opens that tab (bookmarkable); otherwise the last one used.
const fromHash = location.hash.slice(1);
const firstTab = ["review", "map", "time", "list"].includes(fromHash) ? fromHash : store.get("tab") || "review";

(async () => {
  [snap, pending] = [await idb.get("snapshot"), (await idb.get("pending")) || []];
  if (snap) { rebuild(); renderAll(); }   // the copy on the device first, at once
  setTab(firstTab);
  await sync();
  if (!snap) document.getElementById("review").innerHTML =
    `<div class="done"><p>Can't reach Lattice, and there's no copy on this device yet.</p></div>`;
})();

// It stays open on a phone: coming back, or back online, syncs; so does a quarter hour in the foreground.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { store.set("left", Date.now()); return; }
  const before = seen;
  arrived();
  if (seen !== before && state) { renderCounts(); renderList(); redrawMap(); }
  sync();
});
addEventListener("online", sync);
addEventListener("offline", renderSync);
setInterval(() => { if (!document.hidden) sync(); }, 15 * 60e3);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
