<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lattice</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lattice">
<meta name="theme-color" content="#1a1a19">
<style>
  :root { color-scheme: light; --surface-1: #fcfcfb; --surface-2: #f2f1ed; --border: #dedcd5;
          --text-primary: #0b0b0b; --text-secondary: #52514e; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --surface-1: #1a1a19; --surface-2: #242422;
          --border: #3a3936; --text-primary: #ffffff; --text-secondary: #c3c2b7; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--surface-1);
         color: var(--text-primary); font: 16px/1.4 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  form { width: min(360px, 100%); display: grid; gap: 12px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; margin: 0 auto; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
                  background: var(--surface-2); color: var(--text-primary); }
  p { color: var(--text-secondary); margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/apple-touch-icon.png" alt="">
  <h1 style="margin:0;font-size:20px">Lattice</h1>
  <p>/*MESSAGE*/</p>
  <input name="token" type="password" placeholder="Token" autocomplete="current-password" autofocus required>
  <button type="submit">Open</button>
</form>
</body>
</html>
