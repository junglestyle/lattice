[project]
name = "lattice"
version = "0.1.0"
description = "Lattice: navigate the idea lattice that Idea Machine publishes in schema pub."
requires-python = ">=3.13"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
lattice = "lattice.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]
